<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расчёт стоимости пошива</title>
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;padding:10px;background:#EDE9E2;color:#3E3F3D;font-size:14px;}
.container{max-width:1200px;margin:0 auto;}
h1{font-size:18px;margin:0 0 10px;font-weight:600;}
.top-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
input,select,textarea{padding:8px;border:1px solid #C0B5A8;border-radius:4px;font-size:16px;font-family:inherit;background:#FFFDF8;color:#3E3F3D;width:100%;}
input:focus,select:focus{outline:2px solid #6B7A8F;border-color:transparent;}
button{padding:10px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;background:#6B7A8F;color:#fff;font-weight:500;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button.secondary{background:#D8D2C8;color:#3E3F3D;}
button.danger{background:#A8846E;color:#fff;padding:6px 10px;font-size:12px;}
button.mini{background:#D8D2C8;color:#3E3F3D;padding:5px 8px;font-size:12px;}
button.add-line{background:transparent;color:#6B7A8F;padding:6px 0;font-size:13px;text-align:left;font-weight:500;margin-right:12px;}
button.green{background:#96A096;}
.header-block{background:#F7F4EE;border-radius:6px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(62,63,61,.06);}
.header-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.header-grid label{display:block;font-size:11px;color:#8A8578;font-weight:600;margin-bottom:2px;text-transform:uppercase;}
.item{background:#FFFDF8;border:1px solid #C0B5A8;border-radius:6px;margin-bottom:12px;overflow:hidden;}
.item-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#A8B5A3;color:#fff;font-size:14px;font-weight:600;flex-wrap:wrap;}
.item-head select,.item-head input{flex:1;min-width:100px;padding:6px 8px;font-size:13px;font-weight:500;background:#FFFDF8;color:#3E3F3D;border:none;}
.item-head .sep{color:#E6EAE4;}
.item-info{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;padding:8px 10px;background:#E6EAE4;border-bottom:1px solid #C5CFC1;font-size:13px;align-items:center;}
.item-info label{font-size:11px;color:#5A6855;font-weight:600;white-space:nowrap;}
.item-info input{padding:6px;font-size:14px;}
.work-row{padding:8px 10px;background:#FDFBF6;border-bottom:1px solid #E5DFD3;}
.work-row label{font-size:11px;color:#8A8578;font-weight:600;margin-bottom:2px;display:block;text-transform:uppercase;}
.section{background:#FDFBF6;border-bottom:1px solid #E5DFD3;}
.section-head{padding:6px 10px;background:#EDE9E2;font-size:11px;color:#8A8578;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.section-body{padding:0 10px 4px;overflow-x:auto;}
.section-table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px;}
.section-table th{text-align:left;padding:4px 6px;color:#8A8578;font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:1px solid #D8D2C8;}
.section-table th.num{text-align:right;}
.section-table td{padding:3px 4px;vertical-align:middle;}
.section-table td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500;}
.section-table td.actions{width:60px;text-align:right;}
.row-input{width:100%;padding:6px;font-size:13px;background:#FFFDF8;border:1px solid transparent;border-radius:3px;}
.row-input:hover{border-color:#D8D2C8;}
.row-select{width:100%;padding:6px;font-size:13px;background:#FFFDF8;border:1px solid transparent;min-width:180px;}
.qty-input{width:80px;text-align:right;}
.markups-section{background:#EDE6DC;border-bottom:1px solid #D4C7B5;}
.markups-head{padding:6px 10px;background:#E0D5C4;font-size:11px;color:#7A6B58;font-weight:700;text-transform:uppercase;}
.markups-body{padding:6px 10px;}
.markup-row{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;margin-bottom:4px;font-size:13px;}
.item-footer{padding:8px 10px;background:#F7F4EE;border-top:2px solid #A8B5A3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.item-total{margin-left:auto;font-size:16px;font-weight:700;}
.master-row{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#EDE6DC;border-top:1px solid #D4C7B5;font-size:13px;flex-wrap:wrap;}
.master-row label{font-size:11px;color:#7A6B58;font-weight:600;text-transform:uppercase;}
.master-row select{width:auto;padding:6px 8px;font-size:13px;}
.master-row input[type="checkbox"]{width:auto;}
.totals-block{background:#F7F4EE;border-radius:6px;padding:12px;margin-top:12px;box-shadow:0 1px 2px rgba(62,63,61,.06);}
.totals-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;}
.totals-row.grand{font-size:18px;font-weight:700;border-top:2px solid #3E3F3D;margin-top:8px;padding-top:12px;}
.markup-checks{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;padding:8px 0;border-top:1px dashed #C0B5A8;border-bottom:1px dashed #C0B5A8;}
.markup-checks label{display:flex;align-items:center;gap:6px;font-size:13px;}
.markup-checks input[type="checkbox"]{width:auto;}
.saved-panel{background:#F7F4EE;border-radius:6px;padding:10px;margin-bottom:10px;display:none;}
.saved-list{max-height:400px;overflow-y:auto;}
.saved-item{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #E5DFD3;flex-wrap:wrap;}
.saved-info{flex:1;min-width:150px;}
.saved-name{font-weight:600;}
.saved-date{font-size:12px;color:#8A8578;}
.saved-sum{font-weight:600;color:#6B7A8F;}
.hint-note{font-size:11px;color:#8A8578;padding:4px 10px;background:#FDFBF6;}
@media(max-width:700px){
  .header-grid{grid-template-columns:1fr;}
  .item-info{grid-template-columns:auto 1fr;}
  .markup-row{grid-template-columns:1fr;}
}
</style>
</head>

<div class="container">
<div class="no-print">
  <h1>РАСЧЁТ СТОИМОСТИ ПОШИВА</h1>
  <div class="top-actions">
    <button onclick="newOrder()">Новый расчёт</button>
    <button class="secondary" onclick="showSaved()">Мои расчёты</button>
    <button class="secondary" onclick="saveToCloud()">Сохранить</button>
    <button class="secondary" onclick="exportBackup()">Резервная копия</button>
    <button class="secondary" onclick="importBackup()">Восстановить</button>
    <button class="secondary" onclick="showExecutors()">Исполнители</button>
    <button class="secondary" onclick="showDesigners()">Дизайнеры</button>
  </div>
  <div class="saved-panel" id="savedPanel">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <b>Мои расчёты</b>
      <button class="mini" onclick="hideSaved()">Закрыть</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  </div>
  <div class="saved-panel" id="executorsPanel">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <b>Исполнители</b>
      <button class="mini" onclick="hideExecutors()">Закрыть</button>
    </div>
    <div id="executorsList"></div>
    <button class="secondary" onclick="addExecutor()" style="margin-top:8px;">+ Добавить исполнителя</button>
  </div>
  <div class="saved-panel" id="designersPanel">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <b>Дизайнеры</b>
      <button class="mini" onclick="hideDesigners()">Закрыть</button>
    </div>
    <div id="designersList"></div>
    <button class="secondary" onclick="addDesigner()" style="margin-top:8px;">+ Добавить дизайнера</button>
  </div>
  <div class="header-block">
    <div class="header-grid">
      <div><label>Номер заказа</label><input type="text" id="orderNum" placeholder="244"></div>
      <div><label>Дата готовности</label><input type="text" id="readyDate" placeholder="15.10.2026"></div>
      <div><label>Дизайнер</label><select id="designer" onchange="state.designer=this.value"></select></div>
      <div><label>Проект</label><input type="text" id="projectName" placeholder="Название"></div>
    </div>
  </div>
  <div id="itemsContainer"></div>
  <button onclick="addItem()" style="width:100%;padding:12px;font-size:14px;">+ Добавить изделие</button>
  <div class="totals-block">
    <div class="totals-row"><span>Сумма по изделиям:</span><span id="itemsTotal">0 ₽</span></div>
    <div class="markup-checks">
      <label><input type="checkbox" id="urgency50" onchange="syncHeader();recalc();"> Срочно +50%</label>
      <label><input type="checkbox" id="urgency100" onchange="syncHeader();recalc();"> Очень срочно +100%</label>
    </div>
    <div class="totals-row" id="markupRow" style="display:none;"><span>Общие наценки:</span><span id="markupsTotal">0 ₽</span></div>
    <div class="totals-row grand"><span>ВСЕГО К ОПЛАТЕ:</span><span id="grandTotal">0 ₽</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button onclick="printDoc()">Печать / PDF</button>
      <button class="secondary" onclick="copyForSheets()">Скопировать для Google Таблиц</button>
      <button class="green" onclick="printMasters()">Ведомость ЗП</button>
    </div>
  </div>
</div>
</div>

function getMaterialsFor(cat){
  if(cat === 'Римская штора') return MATERIALS.filter(m=>m.romanTape || m.romanCircle || m.velcro);
  if(cat === 'Портьера без подкладки' || cat === 'Портьера на подкладке' || cat === 'Тюль') return MATERIALS.filter(m=>m.tape || m.weight);
  if(cat === 'Покрывало') return MATERIALS.filter(m=>m.synth);
  if(cat === 'Подушка' || cat === 'Валик' || cat === 'Чехол') return MATERIALS.filter(m=>m.zipper || m.taffeta);
  if(cat === 'Бандо') return MATERIALS.filter(m=>m.velcro);
  if(cat === 'Ламбрекен') return MATERIALS.filter(m=>m.tape || m.velcro);
  if(cat === 'Столовый текстиль') return [];
  return MATERIALS;
}

function getCategoryType(cat){
  if(cat === 'Римская штора' || cat === 'Покрывало' || cat === 'Столовый текстиль') return 'квм';
  if(cat === 'Подушка' || cat === 'Валик' || cat === 'Чехол') return 'шт';
  return 'пм';
}

// ==================== ВЫРАЖЕНИЯ ====================
function evalExpr(str){
  if(typeof str === 'number') return str;
  if(!str) return 0;
  let s = String(str).replace(/,/g,'.').replace(/'/g,'').replace(/\s/g,'');
  if(!s) return 0;
  if(!/^[0-9+\-*/().]+$/.test(s)) return parseFloat(s)||0;
  try{
    const r = Function('"use strict";return ('+s+')')();
    return typeof r === 'number' && isFinite(r) ? r : 0;
  }catch(e){ return parseFloat(s)||0; }
}

function syncMainQty(it){
  const w = evalExpr(it.width);
  const h = evalExpr(it.height);
  const t = getCategoryType(it.category);
  let defQty = 0;
  if(t === 'квм') defQty = w * h;
  else if(t === 'пм') defQty = w;
  else defQty = 1;
  it.mainLines.forEach(l=>{
    if(l.source==='custom') return;
    if(l.manual !== true){
      l.qty = defQty ? defQty.toFixed(2) : '0.00';
    }
  });
  syncAutoRows(it);
}

function syncAutoRows(it){
  const totalMainQty = getMainQty(it);
  const w = evalExpr(it.width);
  const h = evalExpr(it.height);
  const inserts = parseInt(it.inserts)||0;
  it.extraLines.forEach(l=>{
    if(l.source==='custom') return;
    const op = OPS[l.opIdx];
    if(!op) return;
    if(op.autoTape && l.manual !== true) l.qty = totalMainQty.toFixed(2);
    else if(op.auto==='vert' && l.manual !== true) l.qty = h.toFixed(2);
    else if(op.auto==='horiz' && l.manual !== true) l.qty = w.toFixed(2);
    else if(op.roman==='circles' && l.manual !== true) l.qty = (w*h).toFixed(2);
    else if(op.roman==='assembly' && l.manual !== true) l.qty = (w*h).toFixed(2);
    else if(op.decor && l.manual !== true) l.qty = (2*(w+h)).toFixed(2);
  });
  it.materialLines.forEach(l=>{
    if(l.source==='custom') return;
    const mat = MATERIALS[l.matIdx];
    if(!mat) return;
    if(mat.romanTape && l.manual !== true) l.qty = (w * inserts).toFixed(2);
    else if(mat.tape && l.manual !== true) l.qty = totalMainQty.toFixed(2);
    else if(mat.synth && l.manual !== true) l.qty = Math.min(w,h).toFixed(2);
  });
}

function getMainQty(it){
  return (it.mainLines||[]).reduce((s,l)=>{
    if(l.source==='custom') return s;
    return s+(parseFloat(l.qty)||0);
  },0);
}

function updateMainLine(id,idx,f,v){
  const it = getItem(id); if(!it || !it.mainLines[idx]) return;
  const l = it.mainLines[idx];
  if(l.source === 'custom'){
    if(f==='name') l.name = v;
    if(f==='qty'){ l.qty = v; updateSum('main',id,idx); }
    if(f==='price'){ l.price = evalExpr(v); updateSum('main',id,idx); }
    return;
  }
  if(f==='workName'){
    l.workName = v;
    const work = PRICE_MAIN.find(w=>w.name===v);
    if(work){
      l.price = work.price;
      const w = evalExpr(it.width), h = evalExpr(it.height);
      const t = getCategoryType(it.category);
      if(t === 'квм') l.qty = (w*h).toFixed(2);
      else if(t === 'пм' && l.manual !== true) l.qty = w ? w.toFixed(2) : l.qty;
      l.manual = false;
    }
    syncAutoRows(it);
    render(); return;
  }
  if(f==='qty'){ l.qty = v; l.manual = true; updateSum('main',id,idx); }
  if(f==='price'){ l.price = evalExpr(v); updateSum('main',id,idx); }
}
function updateExtraLine(id,idx,f,v){
  const it = getItem(id); if(!it || !it.extraLines[idx]) return;
  const l = it.extraLines[idx];
  if(l.source === 'custom'){
    if(f==='name') l.name = v;
    if(f==='qty'){ l.qty = v; updateSum('extra',id,idx); }
    if(f==='price'){ l.price = evalExpr(v); updateSum('extra',id,idx); }
    return;
  }
  if(f==='opIdx'){
    l.opIdx = parseInt(v);
    l.manual = false;
    syncAutoRows(it);
    render(); return;
  }
  if(f==='qty'){ l.qty = v; l.manual = true; updateSum('extra',id,idx); }
}
function updateMaterialLine(id,idx,f,v){
  const it = getItem(id); if(!it || !it.materialLines[idx]) return;
  const l = it.materialLines[idx];
  if(l.source === 'custom'){
    if(f==='name') l.name = v;
    if(f==='qty'){ l.qty = v; updateSum('material',id,idx); }
    if(f==='price'){ l.price = evalExpr(v); updateSum('material',id,idx); }
    return;
  }
  if(f==='matIdx'){
    l.matIdx = parseInt(v);
    l.manual = false;
    syncAutoRows(it);
    render(); return;
  }
  if(f==='qty'){ l.qty = v; l.manual = true; updateSum('material',id,idx); }
}

function updateSum(type,id,idx){
  const it = getItem(id); if(!it) return;
  let sum = 0;
  if(type==='main' && it.mainLines[idx]){
    const l = it.mainLines[idx];
    sum = evalExpr(l.price) * evalExpr(l.qty);
  } else if(type==='extra' && it.extraLines[idx]){
    const l = it.extraLines[idx];
    if(l.source==='custom') sum = evalExpr(l.price) * evalExpr(l.qty);
    else { const op = OPS[l.opIdx]; sum = op ? getOpPrice(op) * evalExpr(l.qty) : 0; }
  } else if(type==='material' && it.materialLines[idx]){
    const l = it.materialLines[idx];
    if(l.source==='custom') sum = evalExpr(l.price) * evalExpr(l.qty);
    else { const mat = MATERIALS[l.matIdx]; sum = mat ? mat.price * evalExpr(l.qty) : 0; }
  }
  const el = document.getElementById('sum_'+type+'_'+id+'_'+idx);
  if(el) el.textContent = fmt(sum);
  const tot = document.getElementById('item_total_'+id);
  if(tot) tot.textContent = fmt(calcItem(it).total);
  recalc();
}

function fmt(n){ return Math.round(n).toLocaleString('ru-RU')+' ₽'; }

function calcItem(it){
  const r = {
    mainBase:0, mainPctBase:0, mainWithBaseMarkups:0,
    extrasSum:0, materialsSum:0, workVolume:0,
    volumeMarkupsSum:0, volumeMarkupsList:[], baseMarkupsList:[],
    total:0, mainLinesData:[], extrasData:[], materialsData:[]
  };

  let mainBase = 0;
  (it.mainLines||[]).forEach(l=>{
    const sum = evalExpr(l.price) * evalExpr(l.qty);
    mainBase += sum;
    const name = l.source==='custom' ? (l.name||'Своя работа') : (l.workName||'—');
    r.mainLinesData.push({name, qty:evalExpr(l.qty), price:evalExpr(l.price), sum});
  });
  r.mainBase = mainBase;

  let pctBase = 0;
  Object.keys(it.markups||{}).forEach(mid=>{
    const val = it.markups[mid];
    const m = MARKUPS.find(x=>x.id===mid);
    if(!m) return;
    if(val.base==='base'){ pctBase += m.pct; r.baseMarkupsList.push({name:m.name,pct:m.pct}); }
  });
  const h = evalExpr(it.height);
  if(h > 3.1){
    const extra = Math.floor(h - 3.1);
    const pct = extra * 30;
    pctBase += pct;
    r.baseMarkupsList.push({name:'Высота >3,1 м (+'+pct+'%)',pct});
  }
  r.mainPctBase = pctBase;
  r.mainWithBaseMarkups = mainBase * (1 + pctBase/100);

  let extrasSum = 0;
  (it.extraLines||[]).forEach(l=>{
    let name = '', price = 0;
    if(l.source==='custom'){ name = l.name||'Своя работа'; price = evalExpr(l.price); }
    else { const op = OPS[l.opIdx]; if(op){ name = op.name; price = getOpPrice(op); } }
    if(name){
      const sum = price * evalExpr(l.qty);
      extrasSum += sum;
      r.extrasData.push({name, qty:evalExpr(l.qty), price, sum});
    }
  });
  r.extrasSum = extrasSum;

  let materialsSum = 0;
  (it.materialLines||[]).forEach(l=>{
    let name = '', price = 0;
    if(l.source==='custom'){ name = l.name||'Своя фурнитура'; price = evalExpr(l.price); }
    else { const mat = MATERIALS[l.matIdx]; if(mat){ name = mat.name; price = mat.price; } }
    if(name){
      const sum = price * evalExpr(l.qty);
      materialsSum += sum;
      r.materialsData.push({name, qty:evalExpr(l.qty), price, sum});
    }
  });
  r.materialsSum = materialsSum;

  const workVolume = r.mainWithBaseMarkups + extrasSum;
  r.workVolume = workVolume;

  let vms = 0;
  Object.keys(it.markups||{}).forEach(mid=>{
    const val = it.markups[mid];
    const m = MARKUPS.find(x=>x.id===mid);
    if(!m) return;
    if(val.base==='volume'){
      const sum = workVolume * m.pct / 100;
      vms += sum;
      r.volumeMarkupsList.push({name:m.name, pct:m.pct, sum});
    }
  });
  r.volumeMarkupsSum = vms;
  r.total = r.mainWithBaseMarkups + extrasSum + materialsSum + vms;
  return r;
}

function calcItemsTotal(){ return state.items.reduce((s,it)=>s+calcItem(it).total,0); }

function recalc(){
  const total = calcItemsTotal();
  let mt = 0;
  if(state.urgency50) mt += total * 0.5;
  if(state.urgency100) mt += total * 1.0;
  const e1=document.getElementById('itemsTotal');
  const e2=document.getElementById('grandTotal');
  const e3=document.getElementById('markupsTotal');
  const e4=document.getElementById('markupRow');
  if(e1) e1.textContent = fmt(total);
  if(e2) e2.textContent = fmt(total+mt);
  if(e3) e3.textContent = fmt(mt);
  if(e4) e4.style.display = mt>0?'flex':'none';
}
// ==================== РЕНДЕР ====================
function render(){
  const c = document.getElementById('itemsContainer');
  if(!c) return;
  if(state.items.length === 0){ c.innerHTML = ''; recalc(); return; }
  c.innerHTML = state.items.map(it => renderItem(it)).join('');
  recalc();
}

    if(state.urgency100) lines.push(['Очень срочно (+100%)','','',Math.round(itemsTotal*1.0)].join('\t'));
    lines.push('');
  }
  lines.push(['','','ВСЕГО К ОПЛАТЕ:',Math.round(gt)].join('\t'));

  copyRichText(html, lines.join('\n'));
  alert('Скопировано! Откройте Google Таблицы и вставьте.');
}

function copyRichText(html, plain){
  if(navigator.clipboard && window.ClipboardItem){
    try{
      const item = new ClipboardItem({
        'text/html': new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([plain], {type:'text/plain'})
      });
      navigator.clipboard.write([item]).catch(()=>copyViaHtmlTextarea(html, plain));
      return;
    }catch(e){}
  }
  copyViaHtmlTextarea(html, plain);
}

function copyViaHtmlTextarea(html, plain){
  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.innerHTML = html;
  document.body.appendChild(container);
  const range = document.createRange();
  range.selectNodeContents(container);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  try{ document.execCommand('copy'); }catch(e){ copyText(plain); }
  sel.removeAllRanges();
  document.body.removeChild(container);
}

function copyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text);
      return;
    }
  }catch(e){}
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

// ==================== ЗП ====================
function calcMasters(){
  const masters = (state.executors||[]).map(ex=>({name:ex.name, sum:0, items:0}));
  if(!masters.length) return {masters:[], totalWork:0, totalMaterials:0, totalFund:0, profit:0};
  const zkIdx = masters.length - 1; // Закройщик — последний в списке

  let totalWork = 0, totalMaterials = 0;
  state.items.forEach(it=>{
    const c = calcItem(it);
    const workSum = c.workVolume + c.volumeMarkupsSum;
    totalWork += workSum;
    totalMaterials += c.materialsSum;
    const fund = workSum / 2;
    const mi = it.masterIdx;
    if(mi >= masters.length || mi === 999) return;
    if(it.masterCuts){
      masters[mi].sum += fund;
      masters[mi].items += 1;
    } else {
      masters[mi].sum += fund * 0.7;
      if(masters[zkIdx]) masters[zkIdx].sum += fund * 0.3;
      masters[mi].items += 1;
      if(masters[zkIdx]) masters[zkIdx].items += 1;
    }
  });
  return {masters, totalWork, totalMaterials, totalFund: totalWork/2, profit: totalWork/2};
}

// ==================== ХРАНЕНИЕ ====================
const STORAGE_KEY = 'curtain_calc_v6';

function getSaved(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch(e){ return []; } }
function setSaved(a){ localStorage.setItem(STORAGE_KEY, JSON.stringify(a)); }

function syncHeader(){
  state.orderNum = document.getElementById('orderNum').value;
  state.readyDate = document.getElementById('readyDate').value;
  state.designer = document.getElementById('designer').value;
  state.projectName = document.getElementById('projectName').value;
  state.urgency50 = document.getElementById('urgency50').checked;
  state.urgency100 = document.getElementById('urgency100').checked;
}

function saveToCloud(){
  syncHeader();
  state.executors = state.executors||loadExecutors();
  state.designers = state.designers||loadDesigners();
  const orders = getSaved();
  const order = {id:'o_'+Date.now(), savedAt:new Date().toISOString(), state:JSON.parse(JSON.stringify(state))};
  const eIdx = orders.findIndex(o=>o.state.orderNum && o.state.orderNum===state.orderNum && o.state.projectName===state.projectName);
  if(eIdx>=0) orders[eIdx] = order; else orders.push(order);
  setSaved(orders);
  alert('Расчёт сохранён');
}

function showSaved(){
  const panel = document.getElementById('savedPanel');
  const list = document.getElementById('savedList');
  const orders = getSaved().slice().reverse();
  if(!orders.length){
    list.innerHTML = '<div style="padding:16px;text-align:center;color:#8A8578;">Нет сохранённых расчётов</div>';
  } else {
    list.innerHTML = orders.map(o=>{
      const st = o.state;
      let total = 0;
      (st.items||[]).forEach(it=>{ total += calcItem(it).total; });
      const date = new Date(o.savedAt).toLocaleDateString('ru-RU');
      return `<div class="saved-item">
        <div class="saved-info">
          <div class="saved-name">${st.orderNum?('№ '+st.orderNum+' — '):''}${st.projectName||'Без названия'}</div>
          <div class="saved-date">${date}${st.designer?' · '+st.designer:''}</div>
        </div>
        <div class="saved-sum">${fmt(total)}</div>
        <button class="mini" onclick="loadOrder('${o.id}')">Открыть</button>
        <button class="danger" onclick="deleteOrder('${o.id}')">X</button>
      </div>`;
    }).join('');
  }
  panel.style.display = 'block';
  document.getElementById('executorsPanel').style.display = 'none';
  document.getElementById('designersPanel').style.display = 'none';
}
function hideSaved(){ document.getElementById('savedPanel').style.display = 'none'; }

function loadOrder(id){
  const order = getSaved().find(o=>o.id===id);
  if(!order){ alert('Не найден'); return; }
  const savedExecutors = state.executors;
  const savedDesigners = state.designers;
  state = JSON.parse(JSON.stringify(order.state));
  if(!state.executors) state.executors = savedExecutors || loadExecutors();
  if(!state.designers) state.designers = savedDesigners || loadDesigners();
  document.getElementById('orderNum').value = state.orderNum||'';
  document.getElementById('readyDate').value = state.readyDate||'';
  document.getElementById('projectName').value = state.projectName||'';
  document.getElementById('urgency50').checked = state.urgency50||false;
  document.getElementById('urgency100').checked = state.urgency100||false;
  updateDesignerSelect();
  document.getElementById('designer').value = state.designer||'';
  hideSaved();
  render();
}

function deleteOrder(id){
  if(!confirm('Удалить?')) return;
  setSaved(getSaved().filter(o=>o.id!==id));
  showSaved();
}

function newOrder(){
  if(!confirm('Начать новый расчёт?')) return;
  const savedExecutors = state.executors;
  const savedDesigners = state.designers;
  state = {orderNum:'',readyDate:'',designer:'',projectName:'',items:[],urgency50:false,urgency100:false,executors:savedExecutors,designers:savedDesigners};
  document.getElementById('orderNum').value='';
  document.getElementById('readyDate').value='';
  document.getElementById('projectName').value='';
  document.getElementById('urgency50').checked=false;
  document.getElementById('urgency100').checked=false;
  itemCounter=0;
  hideSaved();
  render();
}

function exportBackup(){
  const json = JSON.stringify(getSaved(), null, 2);
  const blob = new Blob([json],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toLocaleDateString('ru-RU').replace(/\./g,'-');
  a.href = url; a.download = 'Заказы_'+d+'.json'; a.click();
  URL.revokeObjectURL(url);
}

function importBackup(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(!Array.isArray(imported)) throw new Error('Неверный формат');
        if(!confirm('Добавить '+imported.length+' расчётов?')) return;
        setSaved(getSaved().concat(imported));
        alert('Импортировано: '+imported.length);
        showSaved();
      }catch(err){ alert('Ошибка: '+err.message); }
    };
    r.readAsText(f);
  };
  input.click();
}

// ==================== СОБЫТИЯ ====================
document.getElementById('orderNum').addEventListener('input',e=>state.orderNum=e.target.value);
document.getElementById('readyDate').addEventListener('input',e=>state.readyDate=e.target.value);
document.getElementById('projectName').addEventListener('input',e=>state.projectName=e.target.value);

// ==================== СТАРТ ====================
updateDesignerSelect();
document.getElementById('designer').value = state.designer||'';
render();
</script>
